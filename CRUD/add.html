<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add</title>
</head>
<style>

    .alert-success {
        background-color: forestgreen;
        margin: 10px;
        border-radius: 10px;
        color: white;
    }

    .containers {
        width: 600px;

        margin-top: auto;
        margin-bottom:10px;
        margin-left: 360px;      padding: 25px;
        background-color: #fff;
        border-radius: 10px;
    }


    select{
        margin-bottom: 0px;
        margin-left: 0px;
        margin-right: 0px;
        margin-top: 0px;
    }
    .form-group label {
        display: block;
        margin-bottom: 10px;

        font-weight: 700;
        font-size: 20px;
    }

    label.required span {
        color: red;
    }
    p span.required {
        color: red;
    }
    input[type="submit"] {
        width: 50%;
        padding: 15px;
        background-color: deeppink;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        outline: none;
        transition: background-color 0.3s ease-in-out;
    }


    .form-row {
        display: flex;
    }

    .form-group {
        flex: 1;
        margin-right: 10px;
    }

    .form-group:last-child {
        margin-right: 0;
    }

    h2 {
        text-align: center;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 20px;
    }
    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group select {
        width: 100%;
        height: 40px;
        padding: 5px;
        border-radius: 10px;
        border:  solid pink;
        box-sizing: border-box;
        font-size: 18px;
        outline: none;
        transition: border-color 0.3s ease-in-out;
    }

    .form-group input[type="text"]:focus,
    .form-group input[type="date"]:focus,
    .form-group select:focus {
        border-color: pink;
    }

    .form-group input[type="text"]:-webkit-autofill,
    .form-group input[type="date"]:-webkit-autofill,
    .form-group select:-webkit-autofill {
        box-shadow: 0 0 0 30px pink inset !important;
        -webkit-box-shadow: 0 0 0 30px pink inset !important;
    }


    input[type="submit"]:hover {
        background-color: mediumvioletred;
    }



    .form-group input[type="file"],
    .form-group textarea {
        width: 100%;
        height: 80px;

        padding: 15px;

        border:  solid pink;
        box-sizing: border-box;
        font-size: 18px;
        outline: none;
        resize: vertical;
    }
    .form-group input[type="file"] {
        display: none;
    }




    .row {
        display: flex;
        justify-content: space-between;
    }

    @media (max-width: 768px) {
        .container {
            max-width: 90%;
        }

    }

</style>

<body>
<div class="containers">

    <h2>Personal information</h2>
    <div id="successMessage" class=" alert-success" style="display: none;">

        <div>
            <p style="text-align: center">Update successful!</p>
        </div>
    </div>
    <form  action="edit" method="post"
           enctype="multipart/form-data"   >
        <div class="form-group"style="margin-right:0px">
            <label for="name" class="required"> Name:</label>
            <input type="text"  value="" id="name" name="fullName" placeholder="Enter name" required>
        </div>
        <div class="form-group">
            <label for="city"class="required">Email address:</label>

            <input type="text" value=""id="city" name="city" placeholder="Enter email" required>
        </div>

            <div class="form-group">
                <label for="dob" class="required">Date of Birth:</label>
                <input type="date"value="" id="dob" name="dateOfBirth" required>
            </div>








        <div class="form-group">
            <label for="weight">Address:</label>
            <input type="text"value="" id="weight" name="weight" placeholder="Enter address" required>
        </div>
            <div class="form-group">
                <label for="height">Phone Number:</label>
                <input type="text"value="" id="height" name="height" placeholder="Enter phone number" required>
            </div>


        <div class="form-group">
            <label for="gender" class="required">Class:</label>
            <select id="gender" name="gender" required style="background-color: white">
                <option value="" disabled selected hidden>Open this select menu</option>
                <option value="Man" >D101-C1K14</option>
                <option value="Women" >D101-C2K14</option>
            </select>
        </div>

        <div style="text-align: center" class="form-group">
            <input type="submit" value="Submit">
        </div>
            </form>
</div>
</body>
</html>
