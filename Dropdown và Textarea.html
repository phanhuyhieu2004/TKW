<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<h2>1.text area</h2>
<form action="">
  <label for="message"> Message :</label>
  <br>
  <textarea name="" id="message" cols="40" rows="20"></textarea>
  <br>
  <input type="submit" value="Send me">
</form>
<h2>2.dropdown</h2>
<form action="">
  <label for="color">Chọn màu :</label>
  <br>
  <select name="color" id="" required>
    <option value="">Chọn màu</option>
    <option value="red">Đỏ</option>
    <option value="green">Xanh lá cây</option>
    <option value="pink">Hồng</option>
    <option value="yellow">Vàng</option>
  </select>
  <button>Xác nhận màu gửi</button>
</form>
<h2>3.optgroup</h2>
<form action="">
  <label for="color">Chọn màu :</label>
  <br>
  <select name="color" id="color" required>
    <optgroup label="Nhóm 1">
      <option value="red">Đỏ</option>
      <option value="green">Xanh lá cây</option>
      <option value="pink">Hồng</option>
      <option value="yellow">Vàng</option>
    </optgroup>
    <optgroup label="Nhóm 2">
      <option value="red">Đỏ</option>
      <option value="green">Xanh lá cây</option>
      <option value="pink">Hồng</option>
      <option value="yellow">Vàng</option>
    </optgroup>
    <optgroup label="Nhóm 3">
      <option value="red">Đỏ</option>
      <option value="green">Xanh lá cây</option>
      <option value="pink">Hồng</option>
      <option value="yellow">Vàng</option>
    </optgroup>

  </select>
  <button>Xác nhận màu gửi</button>
</form>
</body>
</html>
