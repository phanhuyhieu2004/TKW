<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .container {
      width: 300px;
      height: 200px;
      background-image: url('https://www.vietnamworks.com/hrinsider/wp-content/uploads/2023/12/anh-thien-nhien-dep-3d-001.jpg');
      position: relative;
    }
    .overlay {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="overlay"></div>
</div>
</body>
</html>
