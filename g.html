<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Web</title>
    <style>
        body { margin: 0; padding: 0; }
        .header, .footer { background-color: #333; color: white; text-align: center; padding: 1em; }
        .nav { background-color: #444; color: white; padding: 1em; }
        .content { margin: 1em; }
        .sidebar { background-color: #777; color: white; padding: 1em; }
        .footer { background-color: #333; color: white; text-align: center; padding: 1em; }
        @media (min-width: 768px) {
            .container { display: flex; }
            .nav, .content, .sidebar { flex: 1; }
        }
    </style>
</head>
<body>
<div class="header">Header</div>
<div class="container">
    <div class="nav">Navigation</div>
    <div class="content">Nội dung chính</div>
    <div class="sidebar">Sidebar</div>
</div>
<div class="footer">Footer</div>
</body>
</html>
