<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .spinner{
      --size:200px;
      --first-color:blue;
      --second-color:yellow;
      position: relative;
      color: white;
      font-size: 1.5rem;
    }
    .spinner::after{
      content: "";
      position: absolute;
      width: var(--size);
      height: var(--size);
      border: 20px solid var(--first-color);
      border-top: 20px solid var(--second-color);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      animation: spin 1s ease-in-out infinite;
      box-shadow:10px 20px 10px 20px white;
    }
    .container{
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      ;
    }
    @keyframes spin {
      0%{
        rotate: 0;
      }
      100%{
        rotate: 360deg;
      }

    }

  </style>
</head>
<body>
<div class="container">
  <div class="spinner">Loading...</div>
</div>
</body>
</html>
