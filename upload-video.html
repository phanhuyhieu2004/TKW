<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/upload-file.css">
</head>
<body>
<div class="container">
    <h3>Upload your video</h3>
    <div class="drag-area video-area">
        <div class="icon">
            <i class="fas fa-video"></i>
        </div>
        <span class="header">Drag & Drop</span>
        <span class="header">or<span class="button">browse</span></span>
        <input type="file" hidden accept="video/*">
        <span class="support">Supports: MP4, WebM, OGG</span>
    </div>
    <h3>Upload your image</h3>
    <div class="drag-area image-area">
        <div class="icon">
            <i class="fas fa-image"></i>
        </div>
        <span class="header">Drag & Drop</span>
        <span class="header">or<span class="button">browse</span></span>
        <input type="file" hidden accept="image/*">
        <span class="support">Supports: JPG, JPEG, PNG, GIF</span>
    </div>
</div>
<script>
    function setupUploadArea(selector, fileType) {
        const dragArea = document.querySelector(selector);
        const dragText = dragArea.querySelector('.header');
        let file;
        let button = dragArea.querySelector('.button');
        let input = dragArea.querySelector('input[type="file"]');

        // Function to open file dialog
        function openFileDialog() {
            input.click();
        }

        button.onclick = () => {
            openFileDialog();
        }

        input.addEventListener('change', function() {
            file = this.files[0];
            dragArea.classList.add('active');
            displayFile();
        })

        // Display file function
        function displayFile() {
            if (!file) return;
            let validExtensions = fileType === 'video' ? ['video/mp4', 'video/webm', 'video/ogg'] : ['image/jpeg', 'image/png', 'image/gif'];
            let fileTypeText = fileType === 'video' ? 'video' : 'image';
            let fileReader = new FileReader();
            if (validExtensions.includes(file.type)) {
                fileReader.onload = () => {
                    let fileURL = fileReader.result;
                    let fileTag = fileType === 'video' ? `<video controls><source src="${fileURL}" type="${file.type}"></video>` : `<img src="${fileURL}" alt="${file.name}">`;
                    dragArea.innerHTML = fileTag;
                    addButtonToDelete();
                };
                fileReader.readAsDataURL(file);
            } else {
                alert(`This file is not a ${fileTypeText}`);
                dragArea.classList.remove('active');
            }
        }

        // Function to add delete button
        function addButtonToDelete() {
            const deleteButton = document.createElement('button');
            deleteButton.innerHTML = '<i class="fas fa-trash"></i>';
            deleteButton.classList.add('delete-button', 'btn-delete');
            deleteButton.addEventListener('click', () => {
                deleteFile();
            });
            dragArea.appendChild(deleteButton);
        }

        // Function to delete file
        function deleteFile() {
            file = null;
            dragArea.innerHTML = '';
            openFileDialog(); // Open file dialog after delete
        }

        // Drag and drop events
        dragArea.addEventListener('dragover', (event) => {
            event.preventDefault();
            dragText.textContent = 'Release to Upload';
            dragArea.classList.add('active');
        });

        dragArea.addEventListener('dragleave', () => {
            dragText.textContent = 'Drag & Drop';
            dragArea.classList.remove('active');
        });

        dragArea.addEventListener('drop', (event) => {
            event.preventDefault();
            file = event.dataTransfer.files[0];
            displayFile();
        });
    }

    // Setup upload area for video
    setupUploadArea('.video-area', 'video');

    // Setup upload area for image
    setupUploadArea('.image-area', 'image');
</script>
</body>
</html>
