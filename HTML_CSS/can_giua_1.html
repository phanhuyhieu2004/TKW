<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>left 50% + margin-left</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f3f3f3;
    font-family:Arial;
}

/* Khung cha */
.parent{
    width:600px;
    height:300px;
    border:3px dashed #333;
    position:relative;
    background:white;
}

/* Kẻ đường chính giữa */
.parent::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:red;
}

/* Ô cần căn giữa */
.child{
    position:absolute;

    width:200px;
    height:80px;

    left:50%;
    margin-left:-100px;

    background:tomato;
    color:white;

    text-align:center;
    line-height:80px;
    font-size:24px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="parent">
    <div class="child">
        Hello
    </div>
</div>

</body>
</html>
<!-- Vì left:50% đã đặt cạnh trái của phần tử ở chính giữa parent. Muốn tâm của phần tử trùng với tâm parent thì phải đưa phần tử lùi về bên trái một nửa chiều rộng của chính nó, nên dùng margin-left âm (-width/2). -->
<!-- Vị trí của child

=

Giữa của parent

-

Nửa chiều rộng của child -->
<!-- left:50% giúp xác định tâm của phần tử cha bằng cách đặt mép trái của phần tử con vào giữa cha. Sau đó margin-left:-width/2 lùi phần tử con sang trái đúng bằng một nửa chiều rộng của nó, khiến tâm của con trùng với tâm của cha. -->
