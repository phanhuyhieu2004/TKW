<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
      .box{
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        /*position: absolute;*/
        position: relative;

      }
        .box1 {
            width: 300px;
            height: 300px;
            background: red;
          top: 50px;
          /*z-index: 1;*/
        }

        .box2 {
            width: 200px;
            height: 200px;
            background: blue;
          /*z-index: 2;*/
        }

        .box3 {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
<div class="content">
    <div class="box box1">Khối 1</div>
    <div class="box box2">Khối 2</div>
    <div class="box box3">Khối 3</div>
</div>
</body>
</html>
