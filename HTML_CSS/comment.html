<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Title</title>
  <style>
    body{
      box-sizing: border-box;
      font-size: 14px;
      background: #fff;
      font-family: -apple-system;
    }
    .comment-box,
    .post-comment .list{
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 2px #0002;
    }
    .comment-session{
      width: 650px;
      height: auto;
      margin: 0 auto;
    }
    .post-comment .list{
      width: 100%;
      margin-bottom: 12px;
    }
    .post-comment .list .user{
      display: flex;
      padding: 8px;
      overflow: hidden;
    }
    .post-comment .list .user img{
      height: 38px;
      width: 38px;
      margin-right: 10px;
      border-radius: 50%;
    }
    .comment-session .name{
      text-transform: uppercase;
      font-weight: 500;
    }
    .post-comment .list .day{
      font-size: 12px;
    }
    .post-comment .comment-post{
      padding: 0 0 15px 58px;
    }
    .comment-box{
      padding: 10px;
      overflow: hidden;
    }
    .comment-box .user{
      display: flex;
      width: min-content;
    }
    .comment-box .image img{
      width: 24px;
      height: 24px;
      margin-right: 10px;
      border-radius: 50%;
    }
    .comment-box textarea{
      background: #fff;
      width:calc(100% - 20px);
      height: 152px;
      margin: 10px 0;
      padding: 10px;
      resize: inherit;
      border-radius: 5px;
      border: none;
      box-shadow: 0 0 0 1px #0003;
    }
    .comment-box textarea:focus-visible{
      box-shadow:  inset 0 0 0 1px #009cff;
      outline: none;

    }
    .comment-box .comment-submit{
      float: right;
      padding: 6px 10px;
      border: none;
      background: #009cff;
      color: #eee;
      cursor:pointer;
      border-radius: 3px;
    }
    .comment-box .comment-submit:hover{
      background: #0076bf;
    }
    @media (max-width: 660px) {
      .comment-session{
        width: 100%;
      }

    }
  </style>
</head>
<body>
<div class="comment-session">
  <div class="post-comment">
    
      <div class="list">
        <div class="user">
          <div class="user-image"><img src="favicon.ico"></div>
          <div class="user-meta">
            <div class="name">Helllo</div>
            <div class="day">10 day ago</div>
          </div>
        </div>
        <div class="comment-post">suavitate efficitur assueverit deserunt ornatus movet senserit facilisi honestatis mentitum

        </div>
      </div>
    </div>
  <div class="comment-box">
    <div class="user">
      <div class="image"><img src="favicon.ico"></div>
      <div class="name" >Regjf</div>
    </div>
    <form action="" method="post">
      <textarea name="" id="" cols="30" rows="10" placeholder="Nhập cmt"></textarea>
      <button class="comment-submit">Comment</button>
    </form>
  </div>
  </div>

</body>
</html>
