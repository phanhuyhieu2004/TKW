<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Giao diện đơn giản</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap"
    rel="stylesheet">

</head>
<body>
<div class="container">
  <button class="btn btn-primary">Watermelon Đỏ Cam</button>


</div>

<style>


  .btn {
    font-size: 16px;
    font-weight: bold;
    padding: 12px 24px;
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  .btn-primary { background-color: #FF6B6B; color: white; }
  .btn-secondary { background-color: #FFC107; color: #333; }
  .btn-success { background-color: #4CAF50; color: white; }
  .btn-danger { background-color: #E53935; color: white; }
  .btn-info { background-color: #1E88E5; color: white; }
  .btn-warning { background-color: #FB8C00; color: white; }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
</style>


</body>
</html>
