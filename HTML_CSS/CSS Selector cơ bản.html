<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selector cơ bản</title>
    <style>
      p {
        color: red;
        font-size: 20px;
      }
      h1 {
        color: blue;
      }
      .demo {
        color: orange;
      }
      .demo2{
        font-size: 40px;
      }
      #doanvan2 {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>Tiêu đề lớn nhất</h1>
    <p id="doanvan2">Đoạn văn1</p>
    <p>Đoạn văn2</p>
    <p class="demo">Đoạn văn3</p>
    <p class="demo demo2">Đoạn văn4</p>

      quis. Sunt omnis corporis veritatis, dignissimos culpa blanditiis eveniet

  </body>
</html>
