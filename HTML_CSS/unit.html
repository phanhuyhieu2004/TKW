<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    /*giá trị tuyệt đối k thay đổi*/
    .container{
      width: 200px;
      height: 500px;
      border: 2px solid red;
      font-size: 12px;
    }
    .container p{
      font-size: 2em;
    }
    .container p span{
      font-size: 1em;
    }
  </style>
</head>
<body>
<div class="container">
  <p ><span> this span</span>This is content</p>
</div>
</body>
</html>
