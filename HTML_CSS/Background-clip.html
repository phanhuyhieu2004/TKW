<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .box{
      width: 200px;
      height: 200px;
      background-image: url("https://raw.githubusercontent.com/GaLaiLapTrinh/tuhoc-html-css/main/0.Full%20code%20ly%20thuyet%20trong%20seri%20bai%20giang%20web/bai75-%20Background-clip/bg/1.PNG");
      border: 50px dotted red;
      padding: 50px;
      background-clip: border-box;
      background-clip: padding-box;
      background-clip: content-box;;
    }
    .text_hl{
      background-color: #00dbde;
    }
    /*css prefix hỗ trợ trình duyệt không sd được thuoc tính*/
    @supports (background-clip: text) or (-webkit-background-clip: text) {
      .text_hl {
        color: transparent;
        background-color: #00dbde;
        background-image: linear-gradient(90deg, #00dbde 0%, #fc00ff 100%);

        background-clip: text;
        -webkit-background-clip: text;
      }}
  </style>
</head>

<body>
<div class="box">

</div>
<h1>Welcome to <strong class="text_hl">Tuhoc.cc</strong> kênh học xập xình cho người mới</h1>
</body>
</html>
