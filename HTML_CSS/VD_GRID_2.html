<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .box1,.box4,.box5{
      background: aqua;
    }
    .box2,.box3{
      background: blue;
    }
    .box{
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container{
      display: grid;
      gap:5px 10px;
      grid-template-areas:
        "header header header"
    "menu content sidebar"
    "menu footer footer";
    }
    .box1{
      grid-area: header;
    }
    .box2{
      grid-area: menu;
    }
    .box3{
      grid-area: content;
    }
    .box4{
      grid-area: sidebar;
    }
    .box5{
      grid-area: footer;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="box box1">Item 1</div>
  <div class="box box2">Item 2</div>
  <div class="box box3">Item 3</div>
  <div class="box box4">Item 4</div>
  <div class="box box5">Item 5</div>
  <div class="box box6">Item 6</div>
</div>
</body>
</html>
