<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .container{
      display: flex;
      height: 150px;
      background: aqua;
      /*flex-wrap: wrap;*/
    }
    .box{
      background: blue;
      border: 1px solid;
      width: 30%;
      /*flex-shrink: 0;*/
    }
    .box1,.box2{
      flex-shrink: 2;
      word-wrap: break-word;
      overflow: auto;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="box box1">
    This is a very long text that might not fit in the box unless it wraps to the next line.  </div>
  <div class="box box2">
    block2
  </div>
  <div class="box box3">
    block3
  </div>
  <div class="box box4">
    block4
  </div>
  <div class="box box5">
    block5
  </div>
  <div class="box box6">
    block6
  </div>


</div>

</body>
</html>
