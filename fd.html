<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful CS .slide-container {
    width: 80%;
    height: 400px;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
    }


    .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
    background-size: cover;
    background-position: center;
    }

    .slide.active {
    opacity: 1;
    }

    .slide:nth-child(1) {
    background-image: url('https://via.placeholder.com/1920x1080/007bff/ffffff?text=Slide%201');
    }

    .slide:nth-child(2) {
    background-image: url('https://via.placeholder.com/1920x1080/6c757d/ffffff?text=Slide%202');
    }

    .slide:nth-child(3) {
    background-image: url('https://via.placeholder.com/1920x1080/28a745/ffffff?text=Slide%203');
    }

    .slide-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }

    .slide-content h2 {
    font-size: 3rem;
    margin-bottom: 1rem;
    }

    .slide-content p {
    font-size: 1.5rem;
    }

    .prev-btn, .next-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2rem;
    padding: 10px 20px;
    background-color: rgba(255, 255, 255, 0.5);
    border: none;
    cursor: pointer;
    }

    .prev-btn {
    left: 20px;
    }

    .next-btn {
    right: 20px;
    }

    .slide-nav {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    }

    .slide-nav-item {
    width: 50px;
    height: 50px;
    background-size: cover;
    background-position: center;
    margin: 0 10px;
    cursor: pointer;
    }

    .slide-nav-item.active {
    border: 2px solid #007bff;
    }

    .slide-nav-item:nth-child(1) {
    background-image: url('https://via.placeholder.com/1920x1080/007bff/ffffff?text=Slide%201');
    }

    .slide-nav-item:nth-child(2) {
    background-image: url('https://via.placeholder.com/1920x1080/6c757d/ffffff?text=Slide%202');
    }

    .slide-nav-item:nth-child(3) {
    background-image: url('https://via.placeholder.com/1920x1080/28a745/ffffff?text=Slide%203');
    }
    S Slide</title>
  <style>
  </style>
</head>
<body>
<div class="slide-container">
  <div class="slide active">
    <div class="slide-content"><h2>Slide 1</h2>
      <p>This is the first slide.</p></div>
  </div>
  <div class="slide">
    <div class="slide-content"><h2>Slide 2</h2>
      <p>This is the second slide.</p></div>
  </div>
  <div class="slide">
    <div class="slide-content"><h2>Slide 3</h2>
      <p>This is the third slide.</p></div>
  </div>
  <button class="prev-btn">&lt;</button>
  <button class="next-btn">&gt;</button>
</div>
<div class="slide-nav">
  <div class="slide-nav-item active"></div>
  <div class="slide-nav-item"></div>
  <div class="slide-nav-item"></div>
</div>
<script> const slides = document.querySelectorAll('.slide');
const prevBtn = document.querySelector('.prev-btn');
const nextBtn = document.querySelector('.next-btn');
const slideNavItems = document.querySelectorAll('.slide-nav-item');
let currentSlideIndex = 0;

function showSlide(index) {
  slides.forEach((slide, i) => {
    slide.classList.toggle('active', i === index);
  });
  slideNavItems.forEach((item, i) => {
    item.classList.toggle('active', i === index);
  });
}

function prevSlide() {
  currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
  showSlide(currentSlideIndex);
}

function nextSlide() {
  currentSlideIndex = (currentSlideIndex + 1) % slides.length;
  showSlide(currentSlideIndex);
}

slideNavItems.forEach((item, index) => {
  item.addEventListener('click', () => {
    currentSlideIndex = index;
    showSlide(currentSlideIndex);
  });
});
prevBtn.addEventListener('click', prevSlide);
nextBtn.addEventListener('click', nextSlide); </script>
</body>
</html>
