<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .btn{
      width: 200px;
      height: 40px;
      background: green;
      color: #fff;
      border: none;
      cursor: pointer;
      /*transition: 0.5s;*/
      transition-duration: 1s;
      transition-property: background-color,color;
      transition-delay: 3s;
    }
    .btn:hover{
      color: yellow;
      background-color: red;
    }
  </style>
</head>
<body>
<button class="btn">
Hover me,please
</button>
</body>
</html>
