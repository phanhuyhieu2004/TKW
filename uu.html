<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1"/>

  <style>
    .name-game {
      padding-right: 10px;
      padding-left: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      row-gap: 10px;
      padding-bottom: 100px;
      justify-content: space-evenly;
      align-items: center;
      align-content: center;
      justify-items: center;
      background: black;
    }
    .nameProfile {
      width: 115px;
      height: 35px;
      border-radius: 20px/20px;
      background-color: hotpink;
      color: white;
    }
  </style>
</head>
<body>
<div class="name-game" >
  <button class="nameProfile">
    <b style="text-align: center">Game:30$</b>
  </button>
  <button class="nameProfile">
    <b style="text-align: center">Song:40$</b>
  </button>
  <button class="nameProfile">
    <b style="text-align: center">Chat:80$</b>
  </button>
  <button class="nameProfile">
    <b style="text-align: center">Entertainment:70$</b>
  </button>
  <button class="nameProfile">
    <b style="text-align: center">Dating:40$</b>
  </button>
  <button class="nameProfile">
    <b style="text-align: center">Other:100$</b>
  </button>
  <!-- Add more buttons here -->
</div>

</body>
</html>
