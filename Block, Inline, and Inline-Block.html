<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
   strong{
    margin: 30px;
     display: inline-block;

     background: #51475a;
   }
   .button {
     display: inline-block; /* Đặt cạnh nhau với các phần tử khác */
     padding: 10px 20px; /* Khoảng cách bên trong giống như nút */
     font-size: 16px; /* Kích thước chữ */
     color: white; /* Màu chữ */
     background-color: #007bff; /* Màu nền của nút */
     text-align: center; /* Căn giữa văn bản */
     text-decoration: none; /* Loại bỏ gạch chân mặc định của liên kết */
     border-radius: 5px; /* Bo tròn góc nút */
     border: 1px solid #007bff; /* Đường viền của nút */
     cursor: pointer; /* Con trỏ chuột dạng tay khi di chuột qua nút */
     transition: background-color 0.3s, border-color 0.3s; /* Hiệu ứng chuyển đổi màu nền và màu viền */
   }

   .button:hover {
     background-color: #0056b3; /* Màu nền khi di chuột qua */
     border-color: #0056b3; /* Màu viền khi di chuột qua */
   }
  </style>
</head>
<body>
<a href="#" class="button">Click Me</a>
<h1>Tự học lâp trình web<strong>Hihi</strong></h1>
<h2>Thẻ h2<strong>Hihi</strong>Nội dung</h2>
</body>
</html>
