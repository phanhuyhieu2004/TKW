<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    button {
      display: flex;
      margin: 30px;
      outline: none;
      border: none;
    }

    .btn {
      padding: 20px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 99px;
      color: #fff;
      background: mediumpurple;
      transition: all 0.5s linear;
    }

    .btn-1:hover {
      transform: translate(0, -15px);
    }

    .btn-2:hover {
      background: orange;
    }

    .btn-3 {
      position: relative;
      overflow: hidden;
    }

    .btn-3::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0;
      background: red;
      transition: width 0.5s linear;
    }

    .btn__span {
      position: relative;

      z-index: 1;
    }

    .btn-3:hover::after {
      width: 100%;
    }

    .btn-4 {
      position: relative;
      overflow: hidden;
    }

    .btn-4::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 0;
      background: red;
      transition: width 0.5s linear;
    }


    .btn-4:hover::after {
      left: 0;
      width: 100%;
    }

    .btn-5 {
      position: relative;
      overflow: hidden;
    }

    .btn-5:after {
      content: "";
      position: absolute;
      top: 0;
     left: 0;
      right: 0;
      height: 0;

      background: red;
      transition: height 0.5s linear;
    }


    .btn-5:hover::after {
     top: 0;
   height: 100%;
    }

  </style>
</head>
<body>
<div class="container">
  <button class="btn btn-1"><span class="btn__span">Hover me</span></button>
  <button class="btn btn-2"><span class="btn__span">Hover me</span></button>
  <button class="btn btn-3"><span class="btn__span">Hover me</span></button>
  <button class="btn btn-4"><span class="btn__span">Hover me</span></button>
  <button class="btn btn-5"><span class="btn__span">Hover me</span></button>
</div>
</body>
</html>
