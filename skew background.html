<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
body{
  background: black;
}
.header{
  color: #fff;
  font-size: 2rem;
  text-align: center;
  padding-top: 50px;
  position: relative;
}
.header::before{
  rotate: 5deg;
  padding: 200px;
  transform: translate(-5%,-30%);
  position: absolute;
  content: "";
  display: block;
  left: 0;
  top:0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: #ff0000;
  background: linear-gradient(90deg,#ff0000 0%, #ffff00 40%, #00ff00 80%);
  background: -webkit-linear-gradient(90deg,#ff0000 0%, #ffff00 40%, #00ff00 80%);
  background: -moz-linear-gradient(90deg,#ff0000 0%, #ffff00 40%, #00ff00 80%);
}
.header__heading{
  color: #000;
}
  </style>
</head>
<body>
<header class="header">
  <h1>I am <strong class="header__heading">Graphics Designer</strong> </h1>
</header>
</body>
</html>
