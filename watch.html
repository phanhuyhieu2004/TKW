<!DOCTYPE html>
<!-- Coding By CodingNepal - codingnepalweb.com -->
<html lang="en" dir="ltr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta charset="UTF-8">
  <title> Dynamic Digital Clock</title>
  <!-- Fontawesome CDN Link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <style>/* Google fonts import link */
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');

  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
    transition: all 0.4s ease;
  }

  html {
    font-size: 62.5%;
  }

  section {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #0093E9;
    background-image: linear-gradient(160deg, #0093E9 0%, #80D0C7 100%);
    padding: 0 20px;
  }

  section.dark {
    background: #24292D;
  }

  section .container {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 220px;
    max-width: 560px;
    width: 100%;
    background: #fff;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    border-radius: 12px;
    position: relative;
  }

  section.dark .container {
    background: #323840;
  }

  section .container .icons i {
    position: absolute;
    right: 17px;
    top: 17px;
    height: 30px;
    width: 30px;
    background: #24292D;
    color: #fff;
    text-align: center;
    line-height: 30px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
  }

  section.dark .container .icons i {
    background: #fff;
    color: #323840;
  }

  .container .icons i.fa-sun {
    opacity: 0;
    pointer-events: none;
  }

  section.dark .container .icons i.fa-sun {
    opacity: 1;
    pointer-events: auto;
    font-size: 1.6rem;
  }

  section .container .time {
    display: flex;
    align-items: center;
  }

  .container .time .time-colon {
    display: flex;
    align-items: center;
    position: relative;
  }

  .time .time-colon .am_pm {
    position: absolute;
    top: 0;
    right: -50px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 1px;
  }

  section.dark .time .time-colon .am_pm {
    color: #fff;
  }

  .time .time-colon .time-text {
    height: 100px;
    width: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background-color: #0093E9;
    background-image: linear-gradient(160deg, #0093E9 0%, #80D0C7 100%);
    background-size: 300% 100%; /* Để màu chuyển động khi hover */
    border-radius: 6px;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    transition: background-position 0.4s ease-in-out; /* Thêm chuyển động cho vị trí */
    cursor: pointer;
  }

  .time .time-colon .time-text:focus {
    outline: none;
  }

  .time .time-colon .time-text:hover {
    background-position: 100% 0; /* Chuyển đến cuối của gradient */
  }


  section.dark .time .time-colon .time-text {
    background: #24292D;
  }

  .time .time-colon .time-text,
  .time .time-colon .colon {
    font-size: 3.5rem;
    font-weight: 600;
  }

  section.dark .time .time-text .num,
  section.dark .time .colon {
    color: #fff;
  }

  .time .time-colon .colon {
    font-size: 4rem;
    margin: 0 10px;
  }

  .time .time-colon .time-text .text {
    font-size: 1.2rem;

    letter-spacing: 2px;
    text-transform: uppercase;


    font-weight: 700;
    line-height: 2em;
    color: #322c2c;
  }

  section.dark .time .time-colon .text {
    color: #fff;
  }

  @media (max-width: 550px) {
    .time .time-colon .colon {
      font-size: 4rem;
      margin: 0 5px;
    }
    .time .time-colon .time-text {
      width: 90px;

    }
    section .container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 220px;

      width: 100%;
      background: #fff;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      position: relative;
      max-width: calc(100% - 5px);
    }

    .time .time-colon .time-text, .time .time-colon .colon {
      font-size: 2rem;
      font-weight: 600;
    }

    .time .time-colon .am_pm {
      top: -20%;
      left: -10%;
      transform: translate(-50%, -50%);
    }
  }
  </style>
</head>
<body>
<section>
  <div class="container">

    <div class="time">
      <div class="time-colon">
        <div class="time-text">
          <span class="num hour_num">08</span>
          <span class="text">Hours</span>
        </div>
        <span class="colon">:</span>
      </div>
      <div class="time-colon">
        <div class="time-text">
          <span class="num min_num">45</span>
          <span class="text">Minutes</span>
        </div>
        <span class="colon">:</span>
      </div>
      <div class="time-colon">
        <div class="time-text">
          <span class="num sec_num">06</span>
          <span class="text">Seconds</span>
        </div>
        <span class="am_pm">AM</span>
      </div>
    </div>
  </div>
</section>
<script>
  // let section = document.querySelector("section"),
  //   icons = document.querySelector(".icons");
  // icons.onclick = ()=>{
  //   section.classList.toggle("dark");
  // }
  // creating a function and calling it in every seconds
  setInterval(() => {
    let date = new Date(),
      hour = date.getHours(),
      min = date.getMinutes(),
      sec = date.getSeconds();
    let d;
    d = hour < 12 ? "AM" : "PM"; //if hour is smaller than 12, than its value will be AM else its value will be pm
    hour = hour > 12 ? hour - 12 : hour; //if hour value is greater than 12 than 12 will subtracted ( by doing this we will get value till 12 not 13,14 or 24 )
    hour = hour == 0 ? hour = 12 : hour; // if hour value is  0 than it value will be 12
    // adding 0 to the front of all the value if they will less than 10
    hour = hour < 10 ? "0" + hour : hour;
    min = min < 10 ? "0" + min : min;
    sec = sec < 10 ? "0" + sec : sec;
    document.querySelector(".hour_num").innerText = hour;
    document.querySelector(".min_num").innerText = min;
    document.querySelector(".sec_num").innerText = sec;
    document.querySelector(".am_pm").innerText = d;
  }, 1000); // 1000 milliseconds = 1s
</script>
</body>
</html>
