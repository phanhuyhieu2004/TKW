<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      21.1 HTML Table Tutorial | Exploring the tr, td, th Elements and More |Tìm
      hiểu cấu trúc bảng HTML
    </title>
  </head>
  <body>
    <h1>Bảng tin</h1>
    <table>
      <thead>
        <tr>
          <th>Tên sp</th>
          <th>Gía cả</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Aó phông</td>
          <td>100.000vnd</td>
        </tr>
        <tr>
          <td>Quần jeans</td>
          <td>200.000vnd</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Tổng cộng</td>
          <td>300.000vnd</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
