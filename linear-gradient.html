<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
<style>
  .box{
    height: 100px;
    margin-bottom: 10px;
  }
  .box2{
    background-image: linear-gradient(to bottom,red,blue);
  }
  .box3{
    width: 300px;
    height: 300px;
    background-image: linear-gradient(to bottom right,red,blue);
  }
  .box1{
    width: 300px;
    height: 300px;
    background-image: linear-gradient(red 40%,blue 50%);
  }
  .box4{
    width: 300px;
    height: 300px;
    background-color: #00DBDE;
    background-image: linear-gradient(315deg, #00DBDE 0%, #FC00FF 100%);
  }
</style>
</head>
<body>
<div class="box box1"></div>
<div class="box box2"></div>
<div class="box box3"></div>
<div class="box box4"></div>
<div class="box box4">

  <span>Hận</span>
</div>
</body>
</html>
