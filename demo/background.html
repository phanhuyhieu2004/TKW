<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .hero {
            position: relative;
            background-image: url('https://res.cloudinary.com/drac9ko3l/image/upload/v1781944285/ChatGPT_Image_15_30_05_20_thg_6_2026_evix22.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .hero img {
            display: block;
            width: 100%;
            height: auto;
            visibility: hidden;
        }
        .hero-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* bạn thêm nội dung overlay vào đây */
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="https://res.cloudinary.com/drac9ko3l/image/upload/v1781944285/ChatGPT_Image_15_30_05_20_thg_6_2026_evix22.png" alt="">
        <div class="hero-content">
            <!-- Thêm nội dung đè lên ảnh ở đây -->
        </div>
    </div>
</body>
</html>
