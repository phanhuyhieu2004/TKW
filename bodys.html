<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: lightblue; /* Màu nền để dễ nhìn thấy */
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

  </style>
</head>
<body>
<div class="content">
  <h1>Welcome to My Page</h1>
  <p>This page uses CSS to make the body element fill the full height of the viewport.</p>
</div>
</body>
</html>
