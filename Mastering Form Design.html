<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    input:placeholder-shown {
      background: aqua;
    }

    input:not(:placeholder-shown) {
      background: yellow;
    }

    .login-form:focus-within button {
      background: blue;
    }
  </style>
</head>
<body>
<form action="" class="login-form">
  <label>
    Username :
    <input tabindex="1" type="text" name="username" id="username" placeholder="username">

  </label><label>
  Password :
  <input tabindex="3" type="text" name="password" id="password" placeholder="password">

</label><label>
  Email :
  <input tabindex="2" type="text" name="email" id="email" placeholder="email">

</label>
  <br>
  <button>Submit</button>
  <fieldset>
    <legend>Choose your favorite monster</legend>

    <input type="radio" id="kraken" name="monster" value="K" />
    <label for="kraken">Kraken</label><br />

    <input type="radio" id="sasquatch" name="monster" value="S" />
    <label for="sasquatch">Sasquatch</label><br />

    <input type="radio" id="mothman" name="monster" value="M" />
    <label for="mothman">Mothman</label>
  </fieldset>

</form>
</body>
</html>
