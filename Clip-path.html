<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .box{
      width: 200px;
      height: 200px;
      background: url(https://github.com/GaLaiLapTrinh/tuhoc-html-css/blob/main/0.Full%20code%20ly%20thuyet%20trong%20seri%20bai%20giang%20web/bai79-%20Clip-path/bg/ava.png?raw=true) center/
      cover;
      /*clip-path: circle(100px);*/
      /*clip-path: circle(50% at 50% 50%);*/
      /*clip-path: inset(20px round 20px);*/
      clip-path: polygon(0 0,100% 0,100% 100%,30% 100% );
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100% );
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="box"></div>
</body>
</html>
